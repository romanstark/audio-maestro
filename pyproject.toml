[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "audio-maestro"
version = "0.1.0"
description = "Local audio analysis and transcription through MCP, independent of a DAW."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD-PARTY.md"]
authors = [{name = "Roman Stark", email = "mail@romanstark.de"}]
dependencies = ["mcp>=1.30,<2", "pydantic>=2.8,<3", "numpy>=1.26,<3",
                "scipy>=1.13,<2", "soundfile>=0.12,<1"]

[project.urls]
Repository = "https://github.com/romanstark/audio-maestro"
Issues = "https://github.com/romanstark/audio-maestro/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.16,<0.17", "pyright>=1.1,<2",
       "pyrefly>=1.2,<2", "build>=1.2,<2"]

[project.scripts]
audio-maestro = "audio_maestro.server:main"
audio-maestro-setup = "audio_maestro.runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_maestro"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/.github", "/.agents/mcp_config.json",
           "/.claude/mcp.json", "/.codex/config.toml", "/.cursor/mcp.json",
           "/.mcp.json", "/README.md", "/LICENSE", "/THIRD-PARTY.md",
           "/CONTRIBUTING.md", "/.gitignore", "/.gitattributes", "/glama.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = ["--doctest-modules"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["E501"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["tests"]

[tool.pyrefly.errors]
untyped-import = "ignore"
unnecessary-type-conversion = "error"
unnecessary-comparison = "error"
bad-return = "error"
